<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clause &amp; Effect — paused</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #0e1117; color: #fafafa; font-family: system-ui, sans-serif; text-align: center; }
    a { display: inline-block; margin-top: 16px; padding: 10px 20px; border-radius: 8px;
        background: #ff4b4b; color: #fff; text-decoration: none; font-weight: 600; }
    p { color: #a3a8b8; max-width: 420px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>📜 Session paused</h1>
    <p>This demo runs on a pay-per-use server, so it pauses after a while without activity.</p>
    <a href="/">Reload the app</a>
  </main>
</body>
</html>
